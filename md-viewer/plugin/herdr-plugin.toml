id = "local.hmd"
name = "hmd markdown viewer"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open clicked file:// .md links, or selected .md paths, in a live rendered pane"
platforms = ["macos", "linux"]

[[actions]]
id = "open-link"
title = "Open markdown link"
command = ["bash", "open.sh"]

[[actions]]
id = "open-selection"
title = "Open selected markdown path"
command = ["bash", "open.sh"]

[[link_handlers]]
id = "md-file-url"
title = "Open markdown file"
pattern = "^file://.*\\.md$"
action = "open-link"
